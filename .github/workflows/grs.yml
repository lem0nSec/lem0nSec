name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=lem0nSec%27s%20Stats&show_icons=true&theme=dark&card_width=400
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated SVG
        shell: bash
        run: |
          set -euo pipefail

          test -s profile/stats.svg

          if grep -qiE "something went wrong|error fetching|bad credentials|rate limit" profile/stats.svg; then
            echo "::error::The generated SVG contains an error card."
            cat profile/stats.svg
            exit 1
          fi

          echo "Generated SVG size: $(wc -c < profile/stats.svg) bytes"

      - name: Commit stats card
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "Update README cards"
          git push
